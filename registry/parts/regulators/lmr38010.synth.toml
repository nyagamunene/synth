id = "lmr38010"
kind = "regulator"
version = 0
lifecycle = "active"
description = "TI LMR38010SDDAR 4.2-80 V input, 1 A synchronous step-down converter, adjustable 400 kHz-2.2 MHz through RT, PFM with spread spectrum, HSOIC-8 (DDA) with exposed thermal pad and open-drain power-good. VFB 1.0 V; VIN abs max 85 V"
mpn = "LMR38010SDDAR"
kicad_footprint = "Package_SO:HSOP-8-1EP_3.9x4.9mm_P1.27mm_EP2.41x3.1mm"

[footprint_dimensions]
width_mm = 4.9
height_mm = 3.9
courtyard_margin_mm = 0.25

[operating_conditions]
min_voltage_v = 4.2
max_voltage_v = 80.0
max_current_ma = 1000.0

[[pins]]
name = "gnd"
number = "1"
electrical_type = "power_input"
required = true

[[pins]]
name = "en"
number = "2"
electrical_type = "input"
required = true

[[pins]]
name = "vin"
number = "3"
electrical_type = "power_input"
required = true

[[pins]]
name = "rt_sync"
number = "4"
# A resistor to GND sets the switching frequency. The pin cannot float or be
# shorted to ground (datasheet 8.3.4).
electrical_type = "passive"
required = true

[[pins]]
name = "fb"
number = "5"
electrical_type = "input"
capabilities = ["feedback"]
required = true

[[pins]]
name = "pg"
number = "6"
electrical_type = "open_drain_low"

[[pins]]
name = "boot"
number = "7"
electrical_type = "passive"
required = true

[[pins]]
name = "sw"
number = "8"
electrical_type = "passive"
capabilities = ["switch_node"]
required = true

[[pins]]
name = "pad"
number = "9"
electrical_type = "power_input"
required = true

# Datasheet 9.2.2.6: at least 4.7 uF ceramic on the input plus 100-220 nF as
# close to the pin as possible.
[[required_decoupling]]
net = "vin"
value = "10uf"
count = 1

[[required_decoupling]]
net = "vin"
value = "220nf"
count = 1

